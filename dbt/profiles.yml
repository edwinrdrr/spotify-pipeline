# Phase 11: per-env GCP projects. Resource names INSIDE each project drop the env
# suffix — the project IS the env, so the dataset is just `spotify_analytics`
# everywhere. CI overrides `dataset:` via DBT_CI_DATASET for per-PR ephemerals.
#
# Auth: WIF in CI/deploy workflows (google-github-actions/auth@v2 sets ADC).
#       ADC locally (gcloud auth application-default login).

spotify_pipeline:
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_DEV') }}"
      dataset: "{{ env_var('DBT_CI_DATASET', 'spotify_analytics') }}"
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive

    staging:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_STAGING') }}"
      dataset: spotify_analytics
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive

    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_PROD') }}"
      dataset: spotify_analytics
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive

  target: dev
