# Phase 7: env separation via dataset suffix inside the one GCP project.
# All targets identical except `dataset:`. Auth via GOOGLE_APPLICATION_CREDENTIALS
# (ADC locally, SA key in CI/deploy workflows). Phase 11 splits projects per env.
spotify_pipeline:
  outputs:
    dev:        # local laptop -> dataset created/owned by you via ADC
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: spotify_analytics_dev
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive

    ci:         # PR validation (.github/workflows/dbt-ci.yml)
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: spotify_analytics_ci
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive

    staging:    # auto-deploy on merge to main (.github/workflows/dbt-deploy-staging.yml)
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: spotify_analytics_staging
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive

    prod:       # manual promote (.github/workflows/dbt-deploy-prod.yml, workflow_dispatch)
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: spotify_analytics_prod
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive

  target: dev   # local default; explicit --target overrides
