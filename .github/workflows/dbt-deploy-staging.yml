name: dbt deploy → staging

# Phase 11: WIF + staging project. Auto-deploy on merge.

on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'requirements-dbt.txt'
      - '.github/workflows/dbt-deploy-staging.yml'

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    env:
      GCP_PROJECT_STAGING: ${{ secrets.GCP_PROJECT_STAGING }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: dbt-ci@${{ secrets.GCP_PROJECT_STAGING }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: dbt build (--target staging)
        working-directory: dbt
        run: dbt build --target staging --no-partial-parse
