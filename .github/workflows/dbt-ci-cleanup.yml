name: dbt CI cleanup (drop ephemeral schema)

# Phase 11: WIF + dev project. On PR close, drops spotify_analytics_ci_pr_<n>.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  drop-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev

    env:
      GCP_PROJECT_DEV: ${{ secrets.GCP_PROJECT_DEV }}
      DBT_CI_DATASET: spotify_analytics_ci_pr_${{ github.event.pull_request.number }}

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: dbt-ci@${{ secrets.GCP_PROJECT_DEV }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Drop ephemeral CI dataset (no-op if missing)
        run: |
          if bq --project_id="$GCP_PROJECT_DEV" ls --format=prettyjson 2>/dev/null \
                  | grep -q "\"$DBT_CI_DATASET\""; then
            bq --project_id="$GCP_PROJECT_DEV" rm -r -d -f "$DBT_CI_DATASET"
            echo "Dropped $DBT_CI_DATASET"
          else
            echo "$DBT_CI_DATASET not present — nothing to drop"
          fi
