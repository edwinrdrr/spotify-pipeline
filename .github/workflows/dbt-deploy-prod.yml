name: dbt deploy → prod

# Phase 11: WIF + prod project. Auto-fire on merge, gated by `production` Environment.

on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'requirements-dbt.txt'
      - '.github/workflows/dbt-deploy-prod.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production    # required-reviewer gate; configured by setup-github-environments.sh

    env:
      GCP_PROJECT_PROD: ${{ secrets.GCP_PROJECT_PROD }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      CI_STATE_BUCKET: ${{ vars.CI_STATE_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: dbt-ci@${{ secrets.GCP_PROJECT_PROD }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: dbt build (--target prod)
        working-directory: dbt
        run: dbt build --target prod --no-partial-parse

      - name: Republish prod manifest (Slim CI baseline)
        run: |
          gsutil cp dbt/target/manifest.json "gs://${CI_STATE_BUCKET}/dbt-state/manifest.json"
