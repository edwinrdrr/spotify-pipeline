name: dbt deploy → prod (manual)

# Phase 7: manual promote. Phase 8: also republish the manifest to GCS so the next
# PR's Slim CI can defer unchanged models to prod.
# Phase 9 will add a required-reviewer gate via GitHub Environments.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      CI_STATE_BUCKET: ${{ secrets.GCP_PROJECT }}-ci-state

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt

      - name: Write GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          umask 077
          echo "$GCP_SA_KEY" > "${RUNNER_TEMP}/sa-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa-key.json" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: dbt build (--target prod)
        working-directory: dbt
        run: dbt build --target prod --no-partial-parse

      - name: Republish prod manifest (Slim CI baseline)
        run: |
          gsutil cp dbt/target/manifest.json "gs://${CI_STATE_BUCKET}/dbt-state/manifest.json"
          echo "Manifest republished: gs://${CI_STATE_BUCKET}/dbt-state/manifest.json"
