name: dbt CI

# Phase 8: Slim CI. Each PR gets an ephemeral schema spotify_analytics_ci_pr_<n>;
# unselected models defer to the prod manifest in gs://<bucket>/dbt-state/manifest.json.
# Only models whose SQL body changed (and their downstream) get rebuilt.
# First PR after a manifest-less repo / a stale manifest falls back to a full build.

on:
  pull_request:
    paths:
      - 'dbt/**'
      - 'requirements-dbt.txt'
      - '.github/workflows/dbt-ci.yml'

permissions:
  contents: read

jobs:
  dbt-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      # Per-PR ephemeral schema; profiles.yml reads this via env_var().
      DBT_CI_DATASET: spotify_analytics_ci_pr_${{ github.event.pull_request.number }}
      CI_STATE_BUCKET: ${{ secrets.GCP_PROJECT }}-ci-state

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt

      - name: Write GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          umask 077
          echo "$GCP_SA_KEY" > "${RUNNER_TEMP}/sa-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/sa-key.json" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Try to fetch prod manifest for Slim CI deferral
        id: manifest
        run: |
          mkdir -p prod-state
          if gsutil ls "gs://${CI_STATE_BUCKET}/dbt-state/manifest.json" >/dev/null 2>&1; then
            gsutil cp "gs://${CI_STATE_BUCKET}/dbt-state/manifest.json" prod-state/manifest.json
            echo "have_manifest=true" >> "$GITHUB_OUTPUT"
            echo "  prod manifest fetched — Slim CI enabled"
          else
            echo "have_manifest=false" >> "$GITHUB_OUTPUT"
            echo "  no prod manifest yet — falling back to full build"
          fi

      - name: dbt deps + build (Slim CI when manifest available)
        working-directory: dbt
        run: |
          if [ "${{ steps.manifest.outputs.have_manifest }}" = "true" ]; then
            dbt build --target ci --no-partial-parse \
                --select state:modified.body+ \
                --defer \
                --state ../prod-state
          else
            dbt build --target ci --no-partial-parse
          fi
