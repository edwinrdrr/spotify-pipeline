name: dbt CI

# Phase 11: WIF auth + dev project. Per-PR ephemeral schema
# spotify_analytics_ci_pr_<n> inside the dev project.

on:
  pull_request:
    paths:
      - 'dbt/**'
      - 'requirements-dbt.txt'
      - '.github/workflows/dbt-ci.yml'

permissions:
  contents: read
  id-token: write   # required for WIF

jobs:
  dbt-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    env:
      GCP_PROJECT_DEV: ${{ secrets.GCP_PROJECT_DEV }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_CI_DATASET: spotify_analytics_ci_pr_${{ github.event.pull_request.number }}
      CI_STATE_BUCKET: ${{ vars.CI_STATE_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: dbt-ci@${{ secrets.GCP_PROJECT_DEV }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Try to fetch prod manifest for Slim CI deferral
        id: manifest
        run: |
          mkdir -p prod-state
          if gsutil ls "gs://${CI_STATE_BUCKET}/dbt-state/manifest.json" >/dev/null 2>&1; then
            gsutil cp "gs://${CI_STATE_BUCKET}/dbt-state/manifest.json" prod-state/manifest.json
            echo "have_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: dbt build (Slim CI when manifest available)
        working-directory: dbt
        run: |
          if [ "${{ steps.manifest.outputs.have_manifest }}" = "true" ]; then
            dbt build --target dev --no-partial-parse \
                --select state:modified.body+ --defer --state ../prod-state
          else
            dbt build --target dev --no-partial-parse
          fi
